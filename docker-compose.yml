services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-therapist_api}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5435:5432"
    networks:
      - backend

  api:
    build: .
    ports:
      - "8085:8085"
    env_file:
      - .env
    depends_on:
      - postgres
    networks:
      backend:
      umatter-shared:
        aliases:
          - therapist-api
    # Resolve host.docker.internal to the host gateway so the container can
    # reach Auth Service's RabbitMQ on the host-published port (5671).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

networks:
  backend:
    driver: bridge
  umatter-shared:
    external: true
