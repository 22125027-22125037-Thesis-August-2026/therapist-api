spring:
  # No datasource block: the PostgreSQL Testcontainer in
  # AbstractPostgresIntegrationTest supplies url/username/password via @ServiceConnection.
  jpa:
    hibernate:
      # Flyway owns the schema here, exactly as in production, so Hibernate only checks
      # that the entity mappings agree with it.
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
  task:
    scheduling:
      enabled: true
