spring:
  application:
    name: therapist-api

  config:
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:therapist_api}
    username: ${DB_USERNAME:${POSTGRES_USER:postgres}}
    password: ${DB_PASSWORD:${POSTGRES_PASSWORD:postgres}}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:${RABBITMQ_AMQP_PORT:5672}}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

server:
  port: ${SERVER_PORT:8085}
  tomcat:
    accesslog:
      enabled: true
      # %D = processing time in ms, %s = HTTP status, %r = first request line.
      pattern: '%h %l %u %t "%r" %s %b %D'

logging:
  level:
    org.springframework.web.servlet.DispatcherServlet: DEBUG
    org.springframework.security: INFO

jwt:
  public-key: ${JWT_PUBLIC_KEY:}
  signing-kid: ${JWT_SIGNING_KID:}
  issuer: ${JWT_ISSUER:mhsa-auth}
  audience: ${JWT_AUDIENCE:mhsa-api}

mhsa:
  auth:
    # auth-service's topic exchange for domain events. Must match auth-service's
    # mhsa.auth.events.exchange so therapist-api's queue binds to the right exchange.
    events:
      exchange: ${AUTH_EVENTS_EXCHANGE:auth.events}
    internal:
      # Base URL of auth-service's internal API, reachable over the shared
      # umatter-shared docker network. Used by the nightly profile reconciliation.
      base-url: ${AUTH_INTERNAL_BASE_URL:http://auth-service:8081}
      reconcile:
        page-size: ${AUTH_RECONCILE_PAGE_SIZE:100}
        cron: ${AUTH_RECONCILE_CRON:0 45 23 * * *}
        zone: ${AUTH_RECONCILE_ZONE:Asia/Ho_Chi_Minh}

video:
  provider: ${VIDEO_PROVIDER:zoom}

zoom:
  app-key: ${ZOOM_APP_KEY:}
  app-secret: ${ZOOM_APP_SECRET:}
